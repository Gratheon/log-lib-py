[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gratheon-log-lib"
version = "1.0.0"
description = "Python logging library with colored console output and optional OTLP persistence"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "opentelemetry-sdk>=1.41,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.41,<2",
]
license = { text = "ISC" }
authors = [
  { name = "Artjom Kurapov" }
]
keywords = ["logging", "logger", "otlp", "opentelemetry", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: ISC License (ISCL)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/Gratheon/log-lib-py"
Repository = "https://github.com/Gratheon/log-lib-py"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py38"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]
